name: Runtime image verification
on:
  push:
    paths:
      - '.github/workflows/runtime-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:worker && npm run check:worker
      - name: Restore verified Vector build image
        id: vector-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/visulia-vector-image.tar
          key: vector-linux-amd64-${{ hashFiles('containers/vector/Dockerfile', 'patches/vector-0.58.0-flush.patch') }}
      - name: Load reusable Vector image
        if: steps.vector-cache.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/visulia-vector-image.tar"
      - name: Build patched Vector and upstream regression tests
        if: steps.vector-cache.outputs.cache-hit != 'true'
        run: |
          docker build --build-arg CARGO_BUILD_JOBS=2 -t visulia-vector:build -f containers/vector/Dockerfile .
          docker save visulia-vector:build -o "$RUNNER_TEMP/visulia-vector-image.tar"
      - name: Preserve completed Vector build before runtime assembly
        if: steps.vector-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/visulia-vector-image.tar
          key: vector-linux-amd64-${{ hashFiles('containers/vector/Dockerfile', 'patches/vector-0.58.0-flush.patch') }}
      - name: Release compiler intermediates before assembling Elastic images
        run: |
          docker builder prune --all --force
          rm -f "$RUNNER_TEMP/visulia-vector-image.tar"
          docker system df
          df -h /
      - name: Exercise patched Vector delivery on Linux
        run: |
          container_id=$(docker create visulia-vector:build)
          docker cp "$container_id:/usr/local/bin/vector" "$RUNNER_TEMP/vector"
          docker rm "$container_id"
          export VECTOR_BIN="$RUNNER_TEMP/vector"
          npm run test:vector
          for attempt in $(seq 1 10); do node --test tests/vector/*.test.mjs; done
      - name: Assemble session runtime
        run: docker build -t visulia-stack:build -f containers/stack/Dockerfile .
      - name: Actual TomEE, Vector, Elasticsearch and Kibana smoke test
        run: node scripts/test-stack.mjs
